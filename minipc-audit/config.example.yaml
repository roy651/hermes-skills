# minipc-audit — expected state for THIS host.
#
# Copy to config.yaml (gitignored) and fill in real values. This repo is public:
# a precise map of which ports are open, which interface is untrusted and which
# tailnet devices exist does not belong in it.
#
# Everything here is a BASELINE, not a policy. The audit compares live state
# against it and reports drift. When you deliberately change the box, update
# this file in the same breath — otherwise the next report cries wolf.

# The interface facing the ISP modem's network, i.e. UPSTREAM of the firewall.
# Anything reachable on this interface is outside your own perimeter.
modem_interface: wlxDEADBEEF0000
modem_ip: 192.168.3.1

# The address services should publish on: the LAN address, never 0.0.0.0.
lan_ip: 192.168.1.16

expect:
  # Ports allowed to listen on 0.0.0.0 / [::].
  # Keep this list as short as you possibly can. A wildcard bind is reachable
  # from the tailnet REGARDLESS of ufw, because Tailscale's ts-input chain
  # accepts everything on tailscale0 before ufw's chains ever run. Narrow socket
  # binds — not firewall rules — are what actually contain a service here.
  wildcard_ports: [22]

  # Full listener baseline ("addr:port" exactly as `ss -tln` prints it).
  # Anything new shows up as drift.
  listeners:
    - 127.0.0.1:8644
    - 0.0.0.0:22
    - "[::]:22"

  # Ports the Tailscale ACL is expected to permit into this node.
  # Verified against the enforced packet filter, not the admin console.
  tailnet_allowed_ports: [22]

  # Device names expected on the tailnet. An unexpected name means someone
  # added a device to your account — which is the thing Tailnet Lock prevents.
  tailnet_nodes:
    - Some Phone

  # Containers that should be running.
  containers:
    - actual-budget

  # Services that should be active (user units first, then system units).
  services:
    - hermes-gateway
    - claude-proxy

  # Ports already known open on the modem. Listed so the audit reports only
  # CHANGE — the modem's surface is known-bad and the real fix is bridge mode.
  modem_ports_known: [21, 22, 23, 80, 139, 443, 445]

# Files that must be owner-readable only (600) or owner-only dirs (700).
# Globs are resolved from /. Includes both credentials and portfolio PII.
sensitive_paths:
  - home/USER/hermes-skills/*/.env
  - home/USER/hermes-skills/*/config.yaml
  - home/USER/hermes-skills/wyckoff/data/*.json
