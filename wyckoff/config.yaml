watchlist:
  - GLD   # gold
  - SLV   # silver
  - XOM   # ExxonMobil — energy, watching 135-137 for accumulation vs. break
  - HBM   # Hudbay Minerals — copper, fundamentals-ahead-of-tape

llm:
  model: anthropic/claude-opus-4-6
  lookback_days: 120

entry:
  # How many top-ranked prescreen survivors get the (token-heavy) LLM Wyckoff read.
  # Lowered from the prescreener's 30 to ease the per-run Claude load. Pass `entry.py --cohort N`
  # on demand to override (lower = cheaper/faster, fewer picks; raise for a fuller sweep).
  cohort_size: 20

reddit:
  pages: 2                      # ApeWisdom pages to fetch (25 tickers per page)
  velocity_warn_threshold: 2.0  # ≥200% mention increase → ⚠️ distribution warning
  radar_top_n: 10               # items in the weekly Radar side-path report
